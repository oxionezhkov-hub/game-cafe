<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#4fb9f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Вкусный Мердж — кухни мира</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<style>
:root{
  --cs:56px;
  --brown:#6b3a1a;--brown-d:#4a2410;
  --cream:#fff7e8;--cream2:#f4e2c2;
  --blue:#3aa0ee;--blue-d:#1f68b8;
  --green:#62c94a;--green-d:#3a9a2c;
  --orange:#ffad42;--orange-d:#e0781c;
  --red:#ff5b5b;--gold:#ffc93a;
  --tile:#e3ebf4;--tile2:#d2deeb;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden}
body{font-family:'Nunito',system-ui,-apple-system,sans-serif;font-weight:800;color:var(--brown);touch-action:none;
  background:#6a3a22 radial-gradient(circle at 50% 0,#ffcf8e,#e59152 45%,#6a3a22 100%)}
.emo{font-family:'Noto Color Emoji','Apple Color Emoji','Segoe UI Emoji',sans-serif;line-height:1;font-weight:400;font-style:normal}
button{font-family:inherit}
.outl{color:#fff;text-shadow:0 2px 0 var(--brown-d),2px 0 0 var(--brown-d),-2px 0 0 var(--brown-d),0 -2px 0 var(--brown-d),1.5px 1.5px 0 var(--brown-d),-1.5px 1.5px 0 var(--brown-d),1.5px -1.5px 0 var(--brown-d),-1.5px -1.5px 0 var(--brown-d),0 3px 0 var(--brown-d)}
.outb{color:#fff;text-shadow:0 2px 0 #174f8f,2px 0 0 #174f8f,-2px 0 0 #174f8f,0 -2px 0 #174f8f,1.5px 1.5px 0 #174f8f,-1.5px 1.5px 0 #174f8f,1.5px -1.5px 0 #174f8f,-1.5px -1.5px 0 #174f8f,0 3px 0 #174f8f}

#app{position:relative;max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;
  background-color:#f3dfc3;
  background-image:linear-gradient(#e8cfae 2px,transparent 2px),linear-gradient(90deg,#e8cfae 2px,transparent 2px);
  background-size:46px 23px;box-shadow:0 0 50px rgba(0,0,0,.45)}

/* ---------- TOP / SCENE ---------- */
#top{position:relative;flex:none;height:calc(206px + env(safe-area-inset-top));overflow:hidden}
#scene{position:absolute;inset:0;overflow:hidden}
#scene .sky{position:absolute;inset:0}
#scene .mid{position:absolute;left:0;right:0;top:48%;height:16%}
#scene .gr{position:absolute;left:0;right:0;top:60%;bottom:0}
#scene .dc{position:absolute;transform:translate(-50%,-50%);filter:drop-shadow(0 3px 2px rgba(0,0,0,.18))}
#scene .cloud{animation:drift 40s linear infinite}
@keyframes drift{from{margin-left:-30px}50%{margin-left:30px}to{margin-left:-30px}}
#res{position:relative;z-index:2;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 8px 0 6px;height:calc(52px + env(safe-area-inset-top))}
.lvl{position:relative;width:48px;height:48px;flex:none;cursor:pointer}
.lvl svg{position:absolute;inset:0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.lvl b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;z-index:1}
.lvl .xpb{position:absolute;left:4px;right:4px;bottom:-5px;height:7px;border-radius:4px;background:#1b4c86;border:1.5px solid #fff;overflow:hidden;z-index:2}
.lvl .xpb i{display:block;height:100%;background:linear-gradient(#ffe36b,#ffb81c);border-radius:3px}
.pill{position:relative;flex:1;min-width:0;height:32px;margin-left:15px;border-radius:16px;background:linear-gradient(#fffdf6,#f2e0bf);
  box-shadow:inset 0 -3px 0 rgba(120,70,20,.12),0 2px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;padding-left:14px;cursor:pointer}
.pill .ic{position:absolute;left:-16px;top:50%;transform:translateY(-50%);font-size:30px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.pill b{font-size:17px;font-weight:900;color:var(--brown);letter-spacing:-.2px}
.pill .plus{position:absolute;left:4px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:linear-gradient(#8be56a,#3faa2b);color:#fff;font-size:15px;line-height:15px;text-align:center;border:1.5px solid #fff;font-weight:900}
.pill .sub{position:absolute;left:-10px;right:-10px;bottom:-14px;text-align:center;font-size:10.5px;white-space:nowrap;line-height:1}
.sq{width:40px;height:40px;flex:none;border-radius:13px;border:2.5px solid #fff;background:linear-gradient(#5ec4ff,#2b86dc);box-shadow:0 3px 0 #1a5ca3,0 5px 8px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;font-size:26px;position:relative;cursor:pointer}
.sq:active,.btn:active,.bb:active{transform:translateY(2px)}
.bang{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:linear-gradient(#ff7a6a,#e62e2e);border:2px solid #fff;color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}

#orders{position:absolute;z-index:2;left:0;right:0;bottom:4px;height:146px;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:4px 8px;touch-action:pan-x;scrollbar-width:none}
#orders::-webkit-scrollbar{display:none}
.order{position:relative;flex:none;height:136px;min-width:150px;background:linear-gradient(#fffefa,#fbf2e2);border-radius:18px;
  box-shadow:0 3px 0 rgba(110,60,20,.25),0 6px 14px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s}
.order.new{animation:slideIn .45s cubic-bezier(.2,1.4,.5,1)}
.order.out{animation:slideOut .45s ease-in forwards}
@keyframes slideIn{from{transform:translateY(160px)}}
@keyframes slideOut{to{transform:translateY(-170px) scale(.8);opacity:0}}
.order.ready{box-shadow:0 0 0 3px #7be05a,0 3px 0 rgba(60,140,30,.4),0 6px 14px rgba(0,0,0,.18)}
.o-main{flex:1;display:flex;align-items:flex-end;padding:0 8px 0 0;gap:2px;min-height:0}
.o-face{position:relative;width:66px;height:100%;flex:none;display:flex;align-items:flex-end;justify-content:center;font-size:58px;overflow:hidden}
.o-face::before{content:'';position:absolute;left:5px;right:3px;bottom:0;height:70px;border-radius:40px 40px 6px 6px;background:var(--fbg,#ffd6a8)}
.o-face span{position:relative;transform:translateY(6px)}
.o-face .nm{position:absolute;top:4px;left:4px;right:0;font-size:10px;font-weight:900;text-align:left;font-family:Nunito;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o-items{display:flex;gap:2px;align-items:flex-end;padding-bottom:6px}
.o-it{position:relative;width:50px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.o-it .e{font-size:38px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.2))}
.o-it .c{font-size:15px;margin-top:1px}
.o-it.ok .c{color:#9cff73}
.o-it.ok::after{content:'✓';position:absolute;right:2px;top:-2px;width:17px;height:17px;border-radius:50%;background:#46b52f;color:#fff;font-size:12px;line-height:17px;text-align:center;border:1.5px solid #fff}
.o-rew{flex:none;height:30px;background:#f1dfbd;display:flex;align-items:center;gap:7px;padding:0 8px;font-size:13px;font-weight:900;color:var(--brown)}
.o-rew .emo{font-size:16px;vertical-align:-2px}
.o-serve{position:absolute;right:6px;bottom:4px;height:28px;padding:0 12px;border:2px solid #fff;border-radius:12px;background:linear-gradient(#8be56a,#3faa2b);box-shadow:0 2px 0 #2a7a1d;font-size:14px;font-weight:900;cursor:pointer;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.o-new-btn{display:flex;align-items:center;justify-content:center;min-width:90px;color:#9a7a5a;font-size:13px;text-align:center;padding:10px}

/* ---------- BOARD ---------- */
#mid{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;padding:7px;border-radius:20px;background:linear-gradient(#ffc066,#f39226);box-shadow:inset 0 2px 0 #ffe0a6,inset 0 -3px 0 #c86a12,0 5px 0 #a8560c,0 10px 22px rgba(0,0,0,.28)}
#board{display:grid;grid-template-columns:repeat(7,var(--cs));grid-auto-rows:var(--cs);gap:3px;padding:4px;border-radius:14px;background:#b9c9dc;box-shadow:inset 0 2px 6px rgba(0,0,0,.18);touch-action:none}
.cell{position:relative;border-radius:calc(var(--cs)*.2);background:linear-gradient(#e9f0f7,#d5e0ec);box-shadow:inset 0 -2px 0 rgba(40,70,110,.08)}
.cell.sel{background:linear-gradient(#ffd56b,#ffaa2b);box-shadow:0 0 0 2.5px #fff,0 0 12px 2px rgba(255,190,40,.9)}
.cell.match{background:linear-gradient(#b4f08f,#6fcf4d)}
.cell.match::after{content:'✓';position:absolute;right:2px;bottom:2px;width:15px;height:15px;border-radius:50%;background:#3a9f25;color:#fff;font-size:10px;line-height:15px;text-align:center;border:1.5px solid #fff;font-family:Nunito;z-index:3}
.cell.hov{box-shadow:0 0 0 3px #fff inset}
.cell.hov.ok{background:linear-gradient(#ffe98a,#ffc93a)}
.cell.lockbox{background:none}
.it{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.64);z-index:1}
.it>.emo{filter:drop-shadow(0 3px 2px rgba(0,0,0,.25));transition:transform .15s}
.it.dragging{opacity:.3}
.cell.pop .it{animation:pop .38s cubic-bezier(.2,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.cell.wig .it{animation:wig .6s ease-in-out 2}
@keyframes wig{20%{transform:rotate(-10deg) scale(1.08)}40%{transform:rotate(9deg) scale(1.08)}60%{transform:rotate(-6deg)}80%{transform:rotate(4deg)}}
.it.max>.emo{animation:shine 2.4s ease-in-out infinite}
@keyframes shine{50%{filter:drop-shadow(0 0 6px #fff7a0) drop-shadow(0 3px 2px rgba(0,0,0,.25)) brightness(1.08)}}
.spark{position:absolute;font-size:calc(var(--cs)*.22);color:#fff58a;text-shadow:0 0 4px #ffd400;animation:twk 1.8s ease-in-out infinite;z-index:2;pointer-events:none;font-family:Nunito}
@keyframes twk{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
.svg{position:absolute;inset:6%;width:88%;height:88%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.22))}
.gbadge{position:absolute;left:1px;top:1px;width:calc(var(--cs)*.3);height:calc(var(--cs)*.3);border-radius:50%;background:linear-gradient(#8ef06a,#35a524);border:1.5px solid #fff;color:#fff;font-style:normal;font-size:calc(var(--cs)*.2);line-height:calc(var(--cs)*.27);text-align:center;z-index:3;font-family:Nunito;font-weight:900}
.need{position:absolute;right:1px;top:-2px;font-style:normal;font-size:calc(var(--cs)*.32);font-weight:900;color:#ffe02a;text-shadow:0 1px 0 #a35b00,1px 0 0 #a35b00,-1px 0 0 #a35b00,0 -1px 0 #a35b00;z-index:3;font-family:Nunito;animation:bob 1s ease-in-out infinite}
.stars{position:absolute;bottom:0;left:0;right:0;text-align:center;font-style:normal;font-size:calc(var(--cs)*.17);color:#ffd84a;text-shadow:0 1px 0 #9a5a00,0 -1px 0 #9a5a00,1px 0 0 #9a5a00,-1px 0 0 #9a5a00;z-index:3;font-family:Nunito;letter-spacing:-1px}
.gen .g{position:absolute;font-size:calc(var(--cs)*.36);filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.gen .g1{left:16%;top:9%}.gen .g2{left:40%;top:3%;font-size:calc(var(--cs)*.4)}.gen .g3{left:61%;top:11%}
.gen svg.crate{position:absolute;left:4%;top:4%;width:92%;height:92%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.chg{position:absolute;right:2px;bottom:1px;min-width:16px;height:16px;padding:0 3px;border-radius:8px;background:#ff8a2a;color:#fff;font-size:10px;font-style:normal;line-height:13px;text-align:center;border:1.5px solid #fff;z-index:3;font-family:Nunito;font-weight:900}
.mini{position:absolute;left:0;right:0;bottom:1px;display:flex;justify-content:center;gap:1px;z-index:3}
.mini span{font-size:calc(var(--cs)*.22);background:rgba(255,255,255,.85);border-radius:6px;padding:1px}
.ring{position:absolute;inset:3px;z-index:3;pointer-events:none}
.tmr{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-size:calc(var(--cs)*.2);z-index:4;font-style:normal;font-family:Nunito;font-weight:900}
.steam{position:absolute;top:-4%;left:50%;font-size:calc(var(--cs)*.3);z-index:4;animation:steam 1.6s ease-out infinite;font-style:normal}
@keyframes steam{0%{opacity:0;transform:translate(-50%,6px) scale(.6)}40%{opacity:.9}100%{opacity:0;transform:translate(-50%,-14px) scale(1.2)}}
.done{position:absolute;top:-10%;left:50%;transform:translateX(-50%);font-size:calc(var(--cs)*.5);z-index:4;animation:bob .9s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff) drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.bubble{position:absolute;inset:2px;border-radius:50%;z-index:3;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,.25) 9% 40%,rgba(160,220,255,.35) 70%,rgba(120,190,255,.6) 100%);border:2px solid rgba(255,255,255,.85);animation:bub 2s ease-in-out infinite}
@keyframes bub{50%{transform:scale(1.04)}}
.bprice{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);z-index:4;background:#fff;border-radius:8px;padding:0 4px;font-size:calc(var(--cs)*.2);font-family:Nunito;font-weight:900;color:#c03aa8;white-space:nowrap}
.box{position:absolute;inset:2px;border-radius:calc(var(--cs)*.18);background:linear-gradient(160deg,#e9bd84,#c98d4f);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.4);z-index:2;overflow:hidden}
.box::before{content:'';position:absolute;left:42%;width:16%;top:0;bottom:0;background:#f4dcb0;opacity:.75}
.box::after{content:'?';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.42);font-weight:900;color:#fff;text-shadow:0 2px 0 #9a5f22,0 -1px 0 #9a5f22,1px 0 0 #9a5f22,-1px 0 0 #9a5f22;font-family:Nunito}
.ice{position:absolute;inset:1px;border-radius:calc(var(--cs)*.18);z-index:2;background:linear-gradient(135deg,rgba(225,245,255,.78),rgba(160,210,245,.5) 55%,rgba(220,240,255,.75));border:2px solid rgba(255,255,255,.9);box-shadow:inset 0 0 8px rgba(255,255,255,.9)}
.ice::before{content:'';position:absolute;left:12%;top:10%;width:30%;height:10%;border-radius:4px;background:rgba(255,255,255,.85);transform:rotate(-30deg)}
.ice::after{content:'';position:absolute;right:14%;bottom:16%;width:18%;height:7%;border-radius:4px;background:rgba(255,255,255,.7);transform:rotate(-30deg)}
#giftBtn{position:absolute;left:-6px;top:-14px;z-index:6;width:52px;height:52px;border-radius:16px;background:linear-gradient(#ff8fc4,#e2448e);border:3px solid #fff;box-shadow:0 3px 0 #a8226a,0 6px 10px rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;font-size:30px;cursor:pointer;animation:bob 1.4s ease-in-out infinite}
#giftBtn .bang{animation:none}

/* ---------- BOTTOM ---------- */
#bottom{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
.bb{position:relative;width:66px;height:66px;flex:none;border-radius:18px;border:3px solid #fff;background:linear-gradient(#5ec4ff,#2b86dc);box-shadow:0 4px 0 #1a5ca3,0 6px 10px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.bb .emo{font-size:34px;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.bb small{font-size:12px;font-weight:900;margin-top:-2px}
.bb.hot{box-shadow:0 0 0 3px #ffe04a,0 4px 0 #1a5ca3,0 6px 16px rgba(255,200,0,.6)}
#info{flex:1;min-width:0;height:66px;border-radius:16px;background:linear-gradient(#fff6e4,#f6e3c0);box-shadow:inset 0 2px 4px rgba(120,70,20,.15);display:flex;align-items:center;gap:8px;padding:0 8px;overflow:hidden}
#info .hintt{flex:1;text-align:center;font-size:13.5px;color:#c07a48}
#info .ie{font-size:36px;flex:none;width:40px;text-align:center;position:relative;height:44px;display:flex;align-items:center;justify-content:center}
#info .ie .svg{inset:0;width:100%;height:100%}
#info .itx{flex:1;min-width:0;line-height:1.15}
#info .itx b{display:block;font-size:14px;line-height:1.1;max-height:31px;overflow:hidden}
#info .itx b em{font-style:normal;color:#e07b1a;font-size:12px}
#info .itx span{display:block;font-size:10.5px;color:#9a6a44;font-weight:700;max-height:24px;overflow:hidden;line-height:1.15}
#info .ib{display:flex;flex-direction:column;gap:4px;flex:none}
#info .ib.one{justify-content:center}
.sb{height:29px;min-width:34px;padding:0 8px;border:2px solid #fff;border-radius:11px;color:#fff;font-weight:900;font-size:13px;cursor:pointer;background:linear-gradient(#5ec4ff,#2b86dc);box-shadow:0 2px 0 #1a5ca3;display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
.sb.g{background:linear-gradient(#8be56a,#3faa2b);box-shadow:0 2px 0 #2a7a1d}
.sb.o{background:linear-gradient(#ffc45e,#f08a1c);box-shadow:0 2px 0 #b35e0c}
.sb.p{background:linear-gradient(#e78bff,#a845d8);box-shadow:0 2px 0 #7a2aa3}
.sb .emo{font-size:14px}

/* ---------- FX ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.fly{position:absolute;left:0;top:0;font-size:40px;will-change:transform;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.ftxt{position:absolute;left:0;top:0;font-size:20px;font-weight:900;white-space:nowrap;will-change:transform}
.part{position:absolute;left:0;top:0;font-size:16px;color:#fff16a;text-shadow:0 0 6px #ffcc00}
.ghost{position:fixed;left:0;top:0;width:var(--cs);height:var(--cs);z-index:90;pointer-events:none;filter:drop-shadow(0 8px 6px rgba(0,0,0,.3))}
.ghost .it{transform:scale(1.18)}
#toast{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:95;pointer-events:none;background:rgba(60,30,10,.88);color:#fff;padding:10px 18px;border-radius:16px;font-size:15px;font-weight:900;text-align:center;max-width:86vw;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}

/* ---------- TUTORIAL ---------- */
#tut{position:absolute;left:8px;right:8px;z-index:60;display:none;align-items:flex-end;gap:6px;pointer-events:none}
#tut .lia{font-size:62px;flex:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3));margin-bottom:-4px}
#tut .bub{position:relative;flex:1;background:#fff;border-radius:16px;padding:10px 12px;font-size:14px;line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.12),0 6px 16px rgba(0,0,0,.2);pointer-events:auto}
#tut .bub::before{content:'';position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:#fff;border-left:0}
#tut .bub .sb{margin-top:6px;display:inline-flex}
.spot{animation:spot 1s ease-in-out infinite!important;z-index:5}
@keyframes spot{50%{box-shadow:0 0 0 4px #fff,0 0 22px 8px #ffd23a}}
.hand{position:fixed;z-index:85;font-size:40px;pointer-events:none;animation:tap 1s ease-in-out infinite}
@keyframes tap{50%{transform:translate(6px,8px) scale(.9)}}

/* ---------- MODALS ---------- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(30,14,4,.6);display:flex;align-items:center;justify-content:center;animation:fade .2s;padding:16px}
@keyframes fade{from{opacity:0}}
.mbox{position:relative;width:min(440px,100%);max-height:88vh;display:flex;flex-direction:column;background:linear-gradient(#fffaf0,#f7e7cb);border-radius:24px;border:4px solid #fff;box-shadow:0 8px 0 rgba(90,45,10,.35),0 16px 40px rgba(0,0,0,.4);animation:popin .3s cubic-bezier(.2,1.5,.5,1)}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.mhead{margin:-22px 26px 0;padding:8px 14px;border-radius:16px;text-align:center;font-size:21px;font-weight:900;background:linear-gradient(#5ec4ff,#2b86dc);border:3px solid #fff;box-shadow:0 4px 0 #1a5ca3}

function def(it){
  switch(it.k){
  case 'i':{const x=CH[it.c].it[it.l-1];return {e:x[0],n:x[1],d:it.l<maxL(it)?'Соедини два, чтобы получить: '+CH[it.c].it[it.l][1]:'Максимальный уровень цепочки «'+CH[it.c].n+'»'};}
  case 'g':return {e:CH[it.c].it[0][0],n:CH[it.c].g,d:'Нажми, чтобы получить «'+CH[it.c].n.toLowerCase()+'» (⚡1). Соедини два — станет мощнее.'};
  case 'a':return {e:'',n:APP[it.c].n,d:it.dn?'Блюдо готово! Нажми, чтобы забрать.':it.ck?'Готовится…':'Перетащи сюда ингредиенты из рецепта.'};
  case 'd':{const r=recipe(it.c);return r?{e:r.e,n:r.n,d:'Готовое блюдо — подай его гостю!'}:{e:'❓',n:'Блюдо',d:''};}
  case 's':{const x=SP[it.c].it[it.l-1];const d=it.c==='chest'?'Нажми, чтобы достать предметы (осталось '+it.n+').':it.c==='coin'?'Нажми, чтобы получить '+x[2]+' 🪙':it.c==='gem'?'Нажми, чтобы получить '+x[2]+' 💎':'Нажми, чтобы получить '+x[2]+' ⚡';return {e:x[0],n:x[1],d};}
  case 't':{const x=TOOLS[it.c];return {e:x[0],n:x[1],d:x[2]};}
  }
}
const isMax=it=>maxL(it)>0&&it.l>=maxL(it);
function cost(k){ // energy-equivalent value of an item key
  const it=fromKey(k);
  if(it.k==='i')return Math.pow(2,it.l-1);
  if(it.k==='d'){const r=recipe(it.c);if(!r)return 4;return r.ing.reduce((a,s)=>a+cost(ingKey(s)),0)+2+Math.round(r.t/30);}
  return 2;
}
function sellPrice(it){if(it.k==='i')return Math.max(1,Math.floor(Math.pow(2,it.l-1)/2));if(it.k==='d')return 3+Math.floor(cost(key(it))/4);if(it.k==='t')return 2;return 0;}

function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=a<0?0:255,p=Math.abs(a);r=Math.round((t-r)*p+r);g=Math.round((t-g)*p+g);b=Math.round((t-b)*p+b);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function crateSVG(t){const C=TIER[t];return `<svg viewBox="0 0 64 64" class="crate"><path d="M9 30h46l-4 25a5 5 0 0 1-5 4H18a5 5 0 0 1-5-4z" fill="${C[0]}" stroke="${C[1]}" stroke-width="2.5"/><path d="M11 41h42M12 51h40" stroke="${C[1]}" stroke-width="2" opacity=".55"/><path d="M22 31l-2 27M42 31l2 27" stroke="${C[1]}" stroke-width="2" opacity=".35"/><rect x="5" y="25" width="54" height="9" rx="4.5" fill="${C[2]}" stroke="${C[1]}" stroke-width="2.5"/><path d="M11 28.5h30" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/></svg>`;}

/* ---------------- ITEM HTML ---------------- */
function itemHTML(it,opt={}){
  if(!it)return '';
  const D=def(it);let h='',cls='it';
  if(it.k==='g'){
    const ch=CH[it.c].it;
    h=`<div class="gen" style="position:absolute;inset:0">${crateSVG(it.l)}<span class="emo g g1">${ch[1][0]}</span><span class="emo g g3">${ch[2][0]}</span><span class="emo g g2">${ch[0][0]}</span></div>`;
    if(!opt.bare)h+=`<i class="gbadge">⟳</i>`;
    if(it.l>1)h+=`<i class="stars">${'★'.repeat(it.l-1)}</i>`;
  }else if(it.k==='a'){
    h=appSVG(it.c,it.l);
    if(it.l>1&&!it.ck&&!it.dn)h+=`<i class="stars">${'★'.repeat(it.l-1)}</i>`;
    if(!opt.bare){
      if(it.dn){const r=recipe(it.dn);h+=`<span class="emo done">${r?r.e:'🍽️'}</span>`;}
      else if(it.ck){h+=`<span class="steam emo">♨️</span>`+ringSVG(it)+`<i class="tmr outl" data-tmr="${it.ck.end}">${fmtT(it.ck.end-now())}</i>`;}
      else if(it.ld&&it.ld.length){h+=`<div class="mini">${it.ld.map(k=>`<span class="emo">${def(fromKey('i:'+k)).e}</span>`).join('')}</div>`;}
    }
  }else{
    h=`<span class="emo">${D.e}</span>`;
    if(it.k==='s'&&it.c==='chest'&&!opt.bare)h+=`<i class="chg">${it.n}</i>`;
    if(isMax(it)&&it.k==='i')cls+=' max';
  }
  return `<div class="${cls}">${h}</div>`;
}
function ringSVG(it){const r=recipe(it.ck.r);const tot=it.ck.end-it.ck.st;const p=clamp(1-(it.ck.end-now())/tot,0,1);const C=2*Math.PI*44;
  return `<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="7"/><circle cx="50" cy="50" r="44" fill="none" stroke="#5fd13c" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 50 50)" data-ring="${it.ck.st}|${it.ck.end}"/></svg>`;}
function fmtT(ms){const s=Math.max(0,Math.ceil(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+'ч '+m+'м':m+':'+String(x).padStart(2,'0');}
function iconOf(k){const it=fromKey(k);if(it.k==='a')return `<span style="display:inline-block;position:relative;width:1.2em;height:1.2em;vertical-align:-.25em">${appSVG(it.c,it.l).replace('class="svg"','style="width:100%;height:100%"')}</span>`;if(it.k==='g')return `<span class="emo">${CH[it.c].it[0][0]}</span>`;return `<span class="emo">${def(it).e}</span>`;}
function nameOf(k){const it=fromKey(k);const d=def(it);if(it.k==='g')return d.n+' ур.'+it.l;if(it.k==='a')return d.n+(it.l>1?' ур.'+it.l:'');return d.n;}

/* ---------------- RESTAURANT INIT ---------------- */
function idx(r,c){return r*COLS+c;}
function makeRest(ri){
  const r=RESTS[ri];
  const b=Array.from({length:NCELL},()=>({it:null,lock:null}));
  const lowItem=()=>{const ch=pick(r.chains.filter(x=>x.at<=2));const x=Math.random();
    if(x<.08)return mk.s('coin',1);if(x<.12)return mk.s('en',1);if(x<.14)return mk.s('gem',1);return mk.i(ch.c,1+Math.min(rnd(4),rnd(4)));};
  // top area: boxes & ice
  for(let i=0;i<COLS*3;i++){const row=Math.floor(i/COLS);
    const p=Math.random();
    if(row<2){ b[i].it=lowItem(); b[i].lock=p<.72?'box':'ice'; }
    else if(p<.55){ b[i].it=lowItem(); b[i].lock=p<.3?'box':'ice'; }
  }
  for(let c=0;c<COLS;c++){ if(Math.random()<.25){b[idx(3,c)].it=lowItem();b[idx(3,c)].lock='ice';} }
  // generators
  const gpos=[idx(8,0),idx(7,0),idx(8,1),idx(7,1),idx(6,0)];let gi=0;
  r.chains.filter(x=>x.at<=0).forEach(x=>{b[gpos[gi++]].it=mk.g(x.c,x.t);});
  // appliances
  const apos=[idx(8,6),idx(7,6),idx(8,5),idx(7,5),idx(6,6)];let ai=0;const seenA={};
  r.recipes.filter(x=>x.at<=0).forEach(x=>{if(!seenA[x.app]){seenA[x.app]=1;b[apos[ai++]].it=mk.a(x.app,1);}});
  // starters
  const st=[idx(5,2),idx(5,4),idx(6,3)];
  st.forEach((p,j)=>{const ch=r.chains.filter(x=>x.at<=0)[j%r.chains.filter(x=>x.at<=0).length];b[p].it=mk.i(ch.c,1);});
  b[idx(4,3)].it=mk.s('coin',1);
  return {board:b,orders:[],decor:{},gifts:[],fridge:[],ul:0,built:0};
}
function enterRest(ri){
  S.ri=ri; if(!S.rests[RESTS[ri].id]){S.rests[RESTS[ri].id]=makeRest(ri);}
  processUnlocks(true); fillOrders(true); sel=-1; applyScene(); renderAll(); save();
}

/* ---------------- UNLOCKS & GIFTS ---------------- */
function appUnits(st,type){let u=0;const add=it=>{if(it&&it.k==='a'&&it.c===type)u+=Math.pow(2,it.l-1);};st.board.forEach(c=>add(c.it));st.fridge.forEach(add);st.gifts.forEach(add);return u;}
function processUnlocks(silent){
  const r=R(),st=ST(),L=loc(r),news=[];
  for(let l=st.ul+1;l<=L;l++){
    r.chains.filter(x=>x.at===l).forEach(x=>{st.gifts.push(mk.g(x.c,x.t));news.push('Новый источник: '+CH[x.c].g);});
    r.recipes.filter(x=>x.at===l).forEach(x=>{
      const need=Math.pow(2,x.lv-1),have=appUnits(st,x.app);
      for(let k=have;k<need;k++)st.gifts.push(mk.a(x.app,1));
      news.push('Новый рецепт: '+x.e+' '+x.n);
    });
  }
  if(L>st.ul)st.ul=L;
  return news;
}

/* ---------------- ORDERS ---------------- */
function slotsN(){return S.lvl<3?2:S.lvl<8?3:S.lvl<25?4:5;}
function chainMaxLv(r,ch){const len=CH[ch.c].it.length;const span=spanOf(RESTS.indexOf(r));const p=clamp((S.lvl-r.start-ch.at)/(span*.85),0,1);return clamp(Math.min(2+Math.floor(p*(len-1)),3+Math.floor(S.lvl/12)),2,len);}
function genOrder(){
  const r=R(),st=ST(),L=loc(r);
  const chains=r.chains.filter(x=>x.at<=L);
  const recs=r.recipes.filter(x=>x.at<=L);
  const used=new Set(st.orders.map(o=>o.cu));
  let ci;do{ci=rnd(CUST.length);}while(used.has(ci)&&used.size<CUST.length-1);
  let n=1;const x=Math.random();
  if(S.lvl>=4)n=x<.5?1:x<.9?2:3; if(S.lvl<12&&n>2)n=2;
  const req=[];let guard=0;
  for(let j=0;j<n&&guard<40;j++,guard++){
    let k;
    if(recs.length&&Math.random()<.38){const w=recs.map((q,i)=>1+i*.6);let t=Math.random()*w.reduce((a,b)=>a+b);let i=0;while(t>w[i]){t-=w[i];i++;}k='d:'+recs[i].id+':0';}
    else{const ch=pick(chains);const mx=chainMaxLv(r,ch);const lv=Math.max(1,mx-rnd(Math.min(3,mx)));k='i:'+ch.c+':'+Math.max(lv,mx>2?2:1);}
    if(req.includes(k)&&Math.random()<.7){j--;if(req.length>=n)break;continue;}
    req.push(k);
  }
  const sig=req.slice().sort().join('|');if(st.orders.some(o=>o.req.slice().sort().join('|')===sig)&&(genOrder.d=(genOrder.d||0)+1)<6)return genOrder();genOrder.d=0;
  const c=req.reduce((a,k)=>a+cost(k),0), m=1+S.ri*.25;
  const o={id:S.oid++,cu:ci,bg:pick(FACE_BG),req,xp:Math.round((c*1.1+3)*m),coins:Math.round((c*1.35+2)*m),ex:[],nw:1};
  if(Math.random()<.16&&S.lvl>=3){const w=Math.random();o.ex.push(w<.3?'s:en:1':w<.55?'s:coin:2':w<.7?'s:gem:1':w<.85?'s:chest:1':w<.95?'t:scissors:0':'t:joker:0');}
  return o;
}
function fillOrders(initial){
  const st=ST();
  if(R().id==='beach'&&S.tut<3&&st.orders.length===0){
    st.orders.push({id:S.oid++,cu:4,bg:'#ffd0e0',req:['i:fruit:2'],xp:12,coins:10,ex:[],nw:1});
    st.orders.push({id:S.oid++,cu:5,bg:'#c9e8ff',req:['i:drink:2'],xp:10,coins:8,ex:[],nw:1});
  }
  while(st.orders.length<slotsN())st.orders.push(genOrder());
}
function boardCount(){const m={};ST().board.forEach(c=>{if(c.it&&!c.lock&&!c.it.b){const k=key(c.it);m[k]=(m[k]||0)+1;}});return m;}
function orderStatus(o,cnt){const need={};o.req.forEach(k=>need[k]=(need[k]||0)+1);let ok=true;const per={};for(const k in need){per[k]=Math.min(cnt[k]||0,need[k]);if(per[k]<need[k])ok=false;}return {need,per,ok};}

/* ---------------- RENDER ---------------- */
function applyScene(){
  const r=R();
  $('#scene').innerHTML=`<div class="sky" style="background:linear-gradient(${r.sky[0]},${r.sky[1]})"></div><div class="mid" style="background:${r.mid}"></div><div class="gr" style="background:linear-gradient(${r.gr},${shade(r.gr,-.12)})"></div>`+
    r.deco.map(d=>`<span class="dc emo${d[0]==='☁️'?' cloud':''}" style="left:${d[1]}%;top:${d[2]}%;font-size:${d[3]}px">${d[0]}</span>`).join('');
}
function renderTop(){
  $('#lvlTxt').textContent=S.lvl;
  const need=xpNeed(S.lvl);$('#xpFill').style.width=(S.lvl>=MAX_LVL?100:clamp(S.xp/need*100,0,100))+'%';
  $('#enTxt').textContent=Math.floor(S.en);
  $('#enSub').textContent=S.en<EN_MAX?'+1 · '+fmtT(EN_REGEN-(now()-S.enT)):'';
  $('#coinTxt').textContent=fmtN(S.coins);$('#gemTxt').textContent=fmtN(S.gems);
  ['#enTxt','#coinTxt','#gemTxt'].forEach(q=>{const e=$(q);e.style.fontSize=e.textContent.length>4?'14.5px':e.textContent.length>3?'16px':'';});

  const sb=$('#shopBtn');sb.innerHTML='<span class="emo">🏪</span>'+(S.shopFree<=now()?'<span class="bang">!</span>':'');

function fmtN(n){return n>=1e6?(n/1e6).toFixed(1).replace('.0','')+'M':n>=1e4?(n/1e3).toFixed(n>=1e5?0:1).replace('.0','')+'K':String(n);}
function renderOrders(){
  const st=ST(),cnt=boardCount();
  const el=$('#orders');
  el.innerHTML=st.orders.map(o=>{
    const s=orderStatus(o,cnt);const c=CUST[o.cu];
    const items=Object.keys(s.need).map(k=>`<div class="o-it${s.per[k]>=s.need[k]?' ok':''}" data-k="${k}"><span class="e">${iconOf(k)}</span><span class="c outl">${s.per[k]}/${s.need[k]}</span></div>`).join('');
    const ex=o.ex.map(k=>iconOf(k)).join('');
    return `<div class="order${s.ok?' ready':''}${o.nw?' new':''}${o.out?' out':''}" data-o="${o.id}"><div class="o-main"><div class="o-face emo" style="--fbg:${o.bg}"><span>${c[0]}</span><i class="nm outl">${c[1]}</i></div><div class="o-items">${items}</div></div>
      <div class="o-rew"><span><span class="emo">⭐</span>${o.xp}</span><span><span class="emo">🪙</span>${o.coins}</span>${ex}</div>${s.ok&&!o.out?`<button class="o-serve outl" data-serve="${o.id}">Подать</button>`:''}</div>`;
  }).join('');
  st.orders.forEach(o=>delete o.nw);
}
function neededInfo(){
  const st=ST(),cnt=boardCount(),need={},chains=new Set(),dishes=new Set();
  st.orders.forEach(o=>{const s=orderStatus(o,cnt);for(const k in s.need){need[k]=1;if(s.per[k]<s.need[k]){const it=fromKey(k);if(it.k==='i')chains.add(it.c);if(it.k==='d')dishes.add(it.c);}}});
  return {need,chains,dishes};
}
function renderBoard(){
  const st=ST(),N=neededInfo(),r=R();
  const appNeed=new Set();N.dishes.forEach(d=>{const x=recipe(d);if(x)appNeed.add(x.app);});
  let h='';
  for(let i=0;i<NCELL;i++){
    const c=st.board[i],it=c.it;let cls='cell',inner='';
    if(c.lock==='box'){cls+=' lockbox';inner='<div class="box"></div>';}
    else if(it){

/* ---------------- BOARD HELPERS ---------------- */
function nearestEmpty(from){
  const st=ST();let best=-1,bd=1e9;const fr=Math.floor(from/COLS),fc=from%COLS;
  for(let i=0;i<NCELL;i++){const c=st.board[i];if(c.it||c.lock)continue;const r=Math.floor(i/COLS),cc=i%COLS;const d=Math.hypot(r-fr,cc-fc)+Math.random()*.01;if(d<bd){bd=d;best=i;}}
  return best;
}
function cellEl(i){return $('#board').children[i];}
function rectOf(el){return el.getBoundingClientRect();}
function canMerge(a,b){if(!a||!b||a.b||b.b)return false;if(key(a)!==key(b))return false;if(a.k==='d'||a.k==='t')return false;if(a.l>=maxL(a))return false;
  if(a.k==='a'&&(a.ck||a.dn||b.ck||b.dn))return false;
  if(a.k==='s'&&a.c==='chest'&&(a.n<SP.chest.it[a.l-1][2]||b.n<SP.chest.it[b.l-1][2]))return false;return true;}
function discover(it){const k=it.k==='d'?R().id+':'+it.c:key(it);if(it.k==='i'||it.k==='d'){if(!S.disc[k]){S.disc[k]=1;return true;}}return false;}
function revealAround(i){const st=ST();const r=Math.floor(i/COLS),c=i%COLS;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dr,dc])=>{const rr=r+dr,cc=c+dc;if(rr<0||rr>=ROWS||cc<0||cc>=COLS)return;const x=st.board[idx(rr,cc)];if(x.lock==='box'){x.lock=x.it?'ice':null;setTimeout(()=>{const e=cellEl(idx(rr,cc));e&&e.classList.add('pop');},20);}});}

/* ---------------- ACTIONS ---------------- */
function tapCell(i){
  const st=ST(),c=st.board[i];
  if(!c.it&&c.lock!=='box'){sel=-1;renderBoard();renderInfo();return;}
  const prevSel=sel;sel=i;
  if(c.lock){renderBoard();renderInfo();if(c.lock==='box')toast('Соединяй предметы рядом, чтобы открыть');return;}
  const it=c.it;
  if(it.b){renderBoard();renderInfo();return;}
  if(it.k==='g'){spawnFrom(i);return;}
  if(it.k==='s'){
    if(it.c==='chest'){openChest(i);return;}
    collectSpecial(i);return;
  }
  if(it.k==='a'&&it.dn){collectDish(i);return;}
  if(it.k==='a'&&prevSel===i&&!it.ck){openRecipes(it.c,it.l);}
  snd('tick');renderBoard();renderInfo();
}
function spawnFrom(i){
  const st=ST(),g=st.board[i].it;
  if(S.en<1){snd('err');openEnergy();renderBoard();renderInfo();return;}
  const t=nearestEmpty(i);if(t<0){snd('err');toast('Нет места на доске! Продай или убери предметы в холодильник.');renderBoard();renderInfo();return;}
  let it;
  if(Math.random()<.025)it=mk.s(Math.random()<.6?'coin':'en',1);
  else{const d=GEN_DIST[g.l];let x=Math.random(),l=1;for(let j=0;j<d.length;j++){if(x<d[j]){l=j+1;break;}x-=d[j];}if(S.tut<2)l=1;it=mk.i(g.c,l);}
  st.board[t].it=it;S.en-=1;if(S.en<EN_MAX&&S.en+1>=EN_MAX)S.enT=now();
  dailyInc('energy',1);discover(it);
  renderAll();snd('pop');
  animSpawn(i,t);save();
}
function animSpawn(from,to){const a=cellEl(from),b=cellEl(to);if(!a||!b)return;const ra=rectOf(a),rb=rectOf(b);const el=b.querySelector('.it');if(!el)return;
  el.animate([{transform:`translate(${ra.left-rb.left}px,${ra.top-rb.top}px) scale(.3)`,opacity:.6},{transform:`translate(${(ra.left-rb.left)/2}px,${(ra.top-rb.top)/2-30}px) scale(.9)`,offset:.5},{transform:'translate(0,0) scale(1.12)',offset:.85},{transform:'none'}],{duration:380,easing:'ease-out'});}
function openChest(i){
  const st=ST(),it=st.board[i].it;const t=nearestEmpty(i);if(t<0){snd('err');toast('Нет места на доске!');return;}
  const r=R(),L=loc(r),chains=r.chains.filter(x=>x.at<=L);let out;const x=Math.random();
  if(x<.14)out=mk.s('coin',1+(Math.random()<.2?1:0));else if(x<.22)out=mk.s('en',1);else if(x<.26)out=mk.s('gem',1);else{const ch=pick(chains);out=mk.i(ch.c,1+rnd(Math.min(3,chainMaxLv(r,ch))));}
  st.board[t].it=out;it.n--;discover(out);if(it.n<=0){st.board[i].it=null;sel=-1;}
  renderAll();snd('pop');animSpawn(i,t);save();
}
function collectSpecial(i){

function collectDish(i){
  const st=ST(),a=st.board[i].it;const t=nearestEmpty(i);if(t<0){snd('err');toast('Нет места, чтобы поставить блюдо!');return;}
  const d=mk.d(a.dn);st.board[t].it=d;a.dn=null;a.ld=[];const nw=discover(d);
  S.stats.cooked++;dailyInc('cook',1);

function dropOn(src,dst){
  const st=ST(),A=st.board[src],B=st.board[dst];const a=A.it;
  if(src===dst){return false;}
  if(B.lock==='box'){snd('err');return false;}
  if(B.lock==='ice'){if(canMerge(a,B.it)){if(doMerge(src,dst)===false)return false;B.lock=null;return true;}snd('err');toast('Соедини с таким же предметом, чтобы разморозить');return false;}
  const b=B.it;
  if(!b){B.it=a;A.it=null;if(sel===src)sel=dst;snd('tick');return true;}
  if(b.b){snd('err');return false;}
  if(a.k==='t'){return useTool(src,dst);}
  if(b.k==='a'&&a.k==='i'){return loadApp(src,dst);}
  if(canMerge(a,b)){return doMerge(src,dst)!==false;}
  // swap
  B.it=a;A.it=b;if(sel===src)sel=dst;else if(sel===dst)sel=src;snd('tick');return true;
}
function doMerge(src,dst){
  const st=ST(),a=st.board[src].it,b=st.board[dst].it;
  if(a.k==='a'){ // return loaded ingredients to the board
    const back=a.ld.concat(b.ld);st.board[src].it=null;st.board[dst].it=null;const spots=[];
    for(const k of back){const t=nearestEmpty(dst);if(t<0)break;spots.push(t);st.board[t].it={k:'_'};}
    spots.forEach(t=>st.board[t].it=null);st.board[src].it=a;st.board[dst].it=b;
    if(spots.length<back.length){snd('err');toast('Освободи место: ингредиенты из приборов вернутся на доску');return false;}
    back.forEach((k,j)=>st.board[spots[j]].it=fromKey('i:'+k));a.ld=[];b.ld=[];
  }
  let res;
  if(a.k==='a'){res=mk.a(a.c,a.l+1);}
  else if(a.k==='s'&&a.c==='chest'){res=mk.s('chest',a.l+1);}
  else res=Object.assign({},a,{l:a.l+1});
  st.board[dst].it=res;st.board[src].it=null;sel=dst;
  S.stats.merged++;dailyInc('merge',1);if(res.l>=4&&res.k==='i')dailyInc('hi',1);
  const nw=discover(res);
  revealAround(dst);
  // bubble
  let bub=-1;
  if(res.k==='i'&&res.l>=3&&Math.random()<.05){const t=nearestEmpty(dst);if(t>=0){st.board[t].it=Object.assign({},res,{b:now()+60000});bub=t;}}
  if(S.tut===1&&res.k==='i')S.tut=2;
  merged={dst,nw,bub};return true;
}
let merged=null;
function afterMergeFX(){
  if(!merged)return;const {dst,nw,bub}=merged;merged=null;const e=cellEl(dst);if(!e)return;e.classList.add('pop');burst(rectOf(e));snd('merge');

  if(bub>=0){const be=cellEl(bub);be&&be.classList.add('pop');setTimeout(()=>toast('Пузырь-бонус! Купи его за 💎, пока не лопнул'),300);}
}
function loadApp(src,dst){
  const st=ST(),a=st.board[src].it,ap=st.board[dst].it,r=R(),L=loc(r);
  if(ap.ck||ap.dn){snd('err');toast(ap.dn?'Сначала забери готовое блюдо':'Прибор занят — блюдо готовится');return false;}
  const k=key(a).slice(2); // 'fruit:2'
  const cand=r.recipes.filter(x=>x.app===ap.c&&x.at<=L);
  const fits=x=>{const need=x.ing.slice();for(const q of ap.ld.concat([k])){const j=need.indexOf(q.replace(/^i:/,''));if(j<0)return false;need.splice(j,1);}return true;};
  const ok=cand.filter(x=>fits(x));
  if(!ok.length){snd('err');const any=r.recipes.find(x=>x.app===ap.c&&x.ing.includes(k));if(any&&any.at>L)toast('Рецепт откроется на уровне '+(r.start+any.at));else toast('Этот ингредиент не подходит для '+APP[ap.c].n.toLowerCase());return false;}
  const okLv=ok.filter(x=>x.lv<=ap.l);
  if(!okLv.length){snd('err');toast('Нужен прибор «'+APP[ap.c].n+'» уровня '+Math.min(...ok.map(x=>x.lv))+'. Соедини два одинаковых прибора!');return false;}
  ap.ld.push(k);st.board[src].it=null;if(sel===src)sel=dst;
  const done=okLv.find(x=>x.ing.length===ap.ld.length);
  snd('tick');
  if(done){const t=done.t*1000*(1-.15*(ap.l-done.lv));ap.ck={r:done.id,st:now(),end:now()+t};ap.ld=[];setTimeout(()=>{toast(done.e+' '+done.n+' готовится!');},50);
    if(!S.seen.cook1){S.seen.cook1=1;}}
  return true;
}
function useTool(src,dst){
  const st=ST(),t=st.board[src].it,b=st.board[dst].it;
  if(t.c==='scissors'){
    if(!b||!(b.k==='i'||b.k==='s'&&b.c!=='chest')||b.l<2){snd('err');toast('Ножницы режут предметы 2+ уровня');return false;}
    const e=nearestEmpty(dst);if(e<0){snd('err');toast('Нет места на доске!');return false;}
    st.board[dst].it=Object.assign({},b,{l:b.l-1});st.board[e].it=Object.assign({},b,{l:b.l-1});st.board[src].it=null;sel=dst;

    st.board[dst].it=res;st.board[src].it=null;sel=dst;discover(res);merged={dst,nw:false,bub:-1};return true;
  }

}
function serve(oid){

/* ---------------- XP & LEVELS ---------------- */
function xpNeed(L){return Math.round(18+7*L+.06*L*L);}
function addXP(n){
  S.xp+=n;
  while(S.lvl<MAX_LVL&&S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;levelUp();}
  if(S.lvl>=MAX_LVL&&S.xp>=xpNeed(MAX_LVL)){S.xp-=xpNeed(MAX_LVL);ST().gifts.push(mk.s('chest',3));toast('Звёздный сундук шефа за опыт! 🧰');}
}
function levelUp(){
  const L=S.lvl,st=ST(),r=R();
  const gems=3+Math.floor(L/25),en=30;S.gems+=gems;S.en+=en;
  const rew=[['💎',gems],['⚡',en]];
  if(L%3===0){const ch=pick(r.chains.filter(x=>x.at<=loc(r)));st.gifts.push(mk.g(ch.c,1));rew.push([CH[ch.c].it[0][0],'Источник']);}
  if(L%5===0){st.gifts.push(mk.s('chest',L%10===0?2:1));rew.push([L%10===0?'📦':'🎁',1]);}
  if(L%10===0){st.gifts.push(mk.t('joker'));rew.push(['🃏',1]);}
  if(L%8===2){st.gifts.push(mk.t('scissors'));rew.push(['✂️',1]);}
  const news=processUnlocks();
  const nx=RESTS.find(x=>x.start===L);
  queueModal(()=>{snd('level');confetti();
    modal('Новый уровень!',`<div class="center"><div style="font-size:64px;line-height:1" class="outb">${L}</div><div class="rw">${rew.map(x=>`<div><span class="emo">${x[0]}</span>${typeof x[1]==='number'?'+'+x[1]:x[1]}</div>`).join('')}</div>
      ${news.map(n=>`<div class="card" style="padding:7px">${n}</div>`).join('')}
      ${nx?`<div class="card" style="background:#fff3c4">🗺️ Достигнут уровень для ресторана «${nx.n}»! Заверши ремонт текущего, чтобы отправиться туда.</div>`:''}
      ${L>=MAX_LVL?'<div class="card" style="background:#fff3c4">🏆 Ты достиг максимального уровня! Ты — легенда мировой кухни!</div>':''}
      <button class="btn" data-close>Отлично!</button></div>`);
  });
}

/* ---------------- ENERGY / TICK ---------------- */
function regen(){
  if(S.en>=EN_MAX){S.enT=now();return;}
  const n=Math.floor((now()-S.enT)/EN_REGEN);
  if(n>0){S.en=Math.min(EN_MAX,S.en+n);S.enT+=n*EN_REGEN;if(S.en>=EN_MAX)S.enT=now();}
}
function tick(){
  regen();
  let changed=false;
  for(const id in S.rests){const st=S.rests[id];st.board.forEach((c,i)=>{const it=c.it;if(!it)return;
    if(it.k==='a'&&it.ck&&it.ck.end<=now()){it.dn=it.ck.r;it.ck=null;changed=true;if(id===R().id){setTimeout(()=>{const e=cellEl(i);e&&e.classList.add('pop');snd('ding');},30);}}
    if(it.b&&it.b<=now()){c.it=Math.random()<.5?mk.s('coin',1):null;changed=true;}
  });}
  if(changed){renderBoard();renderInfo();renderOrders();save();}
  // timers
  document.querySelectorAll('[data-tmr]').forEach(e=>e.textContent=fmtT(+e.dataset.tmr-now()));
  document.querySelectorAll('[data-ring]').forEach(e=>{const [a,b]=e.dataset.ring.split('|').map(Number);const C=2*Math.PI*44;e.setAttribute('stroke-dashoffset',C*(1-clamp((now()-a)/(b-a),0,1)));});
  renderTop();
  if(sel>=0){const c=ST().board[sel];if(c&&c.it&&(c.it.b||c.it.ck))renderInfo();}
  if(undo&&undo.until<=now()){undo=null;renderInfo();}
  ensureDaily();
}

window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid)return;
  if(!drag.on){if(!drag.mv||Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)<9)return;startDrag();}
  moveGhost(e.clientX,e.clientY);
});
window.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pid)return;const d=drag;drag=null;
  if(d.on)endDrag(d,e.clientX,e.clientY);else tapCell(d.i);
});
window.addEventListener('pointercancel',()=>{if(drag&&drag.on)cleanupDrag();drag=null;});
function startDrag(){
  drag.on=true;const st=ST(),it=st.board[drag.i].it;
  ghost=document.createElement('div');ghost.className='ghost';ghost.innerHTML=itemHTML(it);document.body.appendChild(ghost);
  if(sel!==drag.i){sel=drag.i;renderBoard();renderInfo();}
  const e=cellEl(drag.i).querySelector('.it');e&&e.classList.add('dragging');
}
function moveGhost(x,y){
  const cs=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cs'));
  ghost.style.transform=`translate(${x-cs/2}px,${y-cs*.75}px)`;
  const t=document.elementFromPoint(x,y);const c=t&&t.closest('.cell');
  if(hov&&hov!==c){hov.classList.remove('hov','ok');}
  if(c&&+c.dataset.i!==drag.i){hov=c;c.classList.add('hov');const st=ST();const B=st.board[+c.dataset.i];const a=st.board[drag.i].it;
    if(B.it&&!B.it.b&&B.lock!=='box'&&(canMerge(a,B.it)||(B.it.k==='a'&&a.k==='i')||a.k==='t'))c.classList.add('ok');}
  const fb=$('#fridgeBtn');fb.classList.toggle('hot',!!(t&&t.closest('#fridgeBtn')));
}
function cleanupDrag(){ghost&&ghost.remove();ghost=null;hov&&hov.classList.remove('hov','ok');hov=null;$('#fridgeBtn').classList.remove('hot');document.querySelectorAll('.it.dragging').forEach(x=>x.classList.remove('dragging'));}
function endDrag(d,x,y){
  const t=document.elementFromPoint(x,y);cleanupDrag();
  if(t&&t.closest('#fridgeBtn')){toFridge(d.i);return;}
  const c=t&&t.closest('.cell');
  if(c){const ok=dropOn(d.i,+c.dataset.i);renderAll();afterMergeFX();if(ok)save();}
  else{renderBoard();}
}

/* ---------------- DAILY ---------------- */
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
const DT={serve:'Выполни заказы',merge:'Соедини предметы',energy:'Потрать энергию',cook:'Приготовь блюда',hi:'Создай предметы 4+ уровня'};
function ensureDaily(){
  if(S.daily&&S.daily.d===today())return;
  const L=S.lvl,m=1+S.ri*.25,hasRec=R().recipes.some(x=>x.at<=loc());
  S.daily={d:today(),bonus:0,tasks:[
    {t:'serve',g:5+Math.min(10,L>>3),p:0,c:0,r:['💎',3]},
    {t:'merge',g:25+Math.min(60,L>>1),p:0,c:0,r:['⚡',25]},
    {t:'energy',g:50+Math.min(100,L>>1),p:0,c:0,r:['🪙',Math.round(60*m)]},
    hasRec?{t:'cook',g:2+Math.min(6,L>>5),p:0,c:0,r:['🎁',1]}:{t:'hi',g:3,p:0,c:0,r:['🎁',1]}]};
  save();
}
function dailyInc(t,n){ensureDaily();S.daily.tasks.forEach(x=>{if(x.t===t&&x.p<x.g)x.p=Math.min(x.g,x.p+n);});}
function menuBadge(){let n=0;if(S.daily)S.daily.tasks.forEach(x=>{if(x.p>=x.g&&!x.c)n++;});if(S.daily&&!S.daily.bonus&&S.daily.tasks.every(x=>x.c))n++;n+=collUnclaimed();return n;}
function openDaily(){
  ensureDaily();const D=S.daily;
  const all=D.tasks.every(x=>x.c);
  const h=D.tasks.map((x,j)=>`<div class="card"><div class="row"><div style="flex:1"><b style="font-size:14px">${DT[x.t]}</b><div style="font-size:12px;color:#9a6a44">${x.p} / ${x.g}</div></div><span style="font-size:15px"><span class="emo">${x.r[0]}</span>${x.r[1]>1?x.r[1]:''}</span>
    ${x.c?'<button class="sb" style="background:#bbb;box-shadow:none">✓</button>':x.p>=x.g?`<button class="sb g" data-dc="${j}">Забрать</button>`:''}</div><div class="bar" style="margin-top:6px"><i style="width:${x.p/x.g*100}%"></i></div></div>`).join('')+
    `<div class="card row" style="background:#fff3c4"><span class="emo" style="font-size:36px">📦</span><div style="flex:1;font-size:13px">Выполни все задания — получи посылку и 💎10!</div>${D.bonus?'✓':all?'<button class="sb g" id="dBonus">Забрать</button>':''}</div>
    <p class="center" style="font-size:11.5px;color:#9a6a44">Новые задания каждый день</p>`;
  const m=modal('Задания дня',h);
  m.querySelectorAll('[data-dc]').forEach(b=>b.onclick=()=>{const x=D.tasks[+b.dataset.dc];x.c=1;grant(x.r);snd('coin');closeModal();openDaily();renderAll();save();});
  const bb=m.querySelector('#dBonus');if(bb)bb.onclick=()=>{D.bonus=1;S.gems+=10;ST().gifts.push(mk.s('chest',2));snd('level');confetti();closeModal();openDaily();renderAll();save();};
}
function grant(r){const [e,n]=r;if(e==='💎')S.gems+=n;else if(e==='⚡')S.en+=n;else if(e==='🪙')S.coins+=n;else if(e==='🎁')ST().gifts.push(mk.s('chest',1));else if(e==='📦')ST().gifts.push(mk.s('chest',2));}
const LOGIN=[['⚡',20],['🪙',100],['💎',5],['🎁',1],['⚡',50],['🪙',300],['📦',1]];
function checkLogin(){
  if(S.login.d===today())return;
  const y=new Date(Date.now()-864e5);const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
  const day=S.login.d===yd?(S.login.day%7)+1:1;
  S.login={d:today(),day};
  const rw=LOGIN[day-1].slice();if(rw[0]==='🪙')rw[1]=Math.round(rw[1]*(1+S.ri*.5));

   `<h4>Блюда ресторана</h4><div class="chain">${r.recipes.map(x=>{const k=r.id+':'+x.id;const s=S.disc[k];return `<div class="ch-it${s?'':' unk'}${s===1?' claim':''}" data-cl="${k}"><span class="emo">${x.e}</span><small>${s?x.n:'???'}</small></div>`;}).join('')}</div>`;

function taskCost(ri,j){let sum=0;const end=RESTS[ri+1]?RESTS[ri+1].start:MAX_LVL;for(let L=RESTS[ri].start;L<end;L++)sum+=xpNeed(L);const v=sum*(j+1)/36;return v<100?Math.round(v/5)*5:v<1000?Math.round(v/10)*10:Math.round(v/50)*50;}
let homeSel=-1;
function openHome(){homeSel=-1;$('#home').classList.add('on');renderHome();}
function renderHome(){
  const r=R(),st=ST(),ri=S.ri;const built=st.built;

  const say=built>=8?(S.ri<S.unl?'Этот ресторан уже готов! Возвращайся в новый.':nx.i>=RESTS.length?'Ты построил все рестораны мира! Ты — легенда!':nx.ok?'Ремонт закончен! Пора открывать новый ресторан!':'Ремонт закончен! Достигни уровня '+RESTS[nx.i].start+', чтобы открыть новый ресторан.'):pick(tips);

    panel=`<div class="row" style="margin-bottom:8px"><b style="flex:1">Ремонт: ${built}/8</b><span style="font-size:13px">🪙 ${fmtN(S.coins)}</span></div><div class="bar"><i style="width:${built/8*100}%"></i></div>
    <div class="row" style="margin-top:10px"><span class="emo" style="font-size:40px">${d[0]}</span><div style="flex:1"><b>${d[1]}</b><div style="font-size:12px;color:#9a6a44">+💎2 и опыт за постройку</div></div><button class="btn${S.coins>=c?' o':' x'}" id="buildBtn">🪙 ${c}</button></div>`;}
  else{panel=`<div class="row"><b style="flex:1">Ремонт завершён! 8/8 ✨</b></div><div class="bar" style="margin:8px 0"><i style="width:100%"></i></div>`+
    (S.ri===S.unl&&nx.i<RESTS.length?`<div class="row"><span style="flex:1;font-size:13px">Следующий: <b>${RESTS[nx.i].n}</b> (ур. ${RESTS[nx.i].start})</span>${nx.ok?'<button class="btn" id="nextBtn">Открыть!</button>':`<button class="btn x">Ур. ${RESTS[nx.i].start}</button>`}</div>`:'');}
  panel+=`<div class="row" style="margin-top:10px;gap:8px"><button class="btn b" style="flex:1" id="mapBtn">🗺️ Карта</button><button class="btn" style="flex:1" id="backBtn">🍳 На кухню</button></div>`;
  $('#home').innerHTML=`<div class="h-top"><div class="sq" id="hBack" style="font-size:22px;color:#fff">←</div><div class="t outb">${r.n}<small>${r.city}</small></div><div class="pill" style="flex:none;width:96px;margin-left:16px"><span class="ic emo">🪙</span><b>${fmtN(S.coins)}</b></div></div>
   <div class="room" style="--wall:${r.wall};--floor:${r.floor};--sky1:${r.sky[0]};--sky2:${r.sky[1]}"><div class="wall"><div class="win" style="left:6%"><span class="emo" style="left:12%">${r.deco[2]?r.deco[2][0]:''}</span></div><div class="win" style="right:6%"><span class="emo" style="right:12%">${r.deco[r.deco.length-2][0]}</span></div></div><div class="floor"></div><div class="base"></div><div class="rug"></div>
   <div class="sign">${r.n}</div>${slots}<div class="liya"><div class="say">${say}</div><span class="emo">👩‍🍳</span></div>
   ${homeSel>=0&&st.decor[homeSel]!==undefined?`<div class="stylepick">${VAR_F.map((f,v)=>`<div class="${st.decor[homeSel]===v?'on':''}" data-v="${v}"><span class="emo" style="filter:${f}">${r.decor[homeSel][0]}</span></div>`).join('')}</div>`:''}</div>

  H.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>{st.decor[homeSel]=+e.dataset.v;snd('pop');save();renderHome();});
}
function build(){
  const st=ST(),j=st.built;if(j>=8)return;const c=taskCost(S.ri,j);
  if(S.coins<c){snd('err');toast('Не хватает монет! Выполняй заказы 🧑‍🍳');return;}
  S.coins-=c;st.decor[j]=0;st.built++;S.gems+=2;homeSel=j;
  snd('level');renderHome();
  const el=document.querySelector(`#home [data-d="${j}"]`);if(el){const room=$('#home .room'),rr=rectOf(room),re=rectOf(el);
    ['💨','✨','💨'].forEach((x,n)=>{const p=document.createElement('span');p.className='puff emo';p.textContent=x;p.style.left=(re.left-rr.left+re.width/2+(n-1)*30)+'px';p.style.top=(re.top-rr.top+re.height/2)+'px';p.style.animationDelay=n*.1+'s';room.appendChild(p);setTimeout(()=>p.remove(),1100);});

  addXP(Math.round(c*.12));save();

}

/* ---------------- TUTORIAL ---------------- */
let tutForced=null;
function tutSay(t,ok){tutForced={t,ok};tutUpdate();}
function tutUpdate(){
  const el=$('#tut');document.querySelectorAll('.spot').forEach(x=>x.classList.remove('spot'));
  let txt='',btn='';const st=ST();
  if(tutForced){txt=tutForced.t;btn='<br><button class="sb g" id="tutOk">Понятно</button>';}
  else if(R().id==='beach'&&S.tut<5){
    if(S.tut===0){const has=st.board.filter(c=>c.it&&!c.lock&&key(c.it)==='i:fruit:1').length;
      if(has>=2||st.board.some(c=>c.it&&!c.lock&&key(c.it)==='i:fruit:2')){S.tut=1;}
      else{txt='Привет, шеф! Я Лия. Нажми на <b>фруктовый сад</b>, чтобы собрать фрукты!';const i=st.board.findIndex(c=>c.it&&c.it.k==='g'&&c.it.c==='fruit');i>=0&&cellEl(i)&&cellEl(i).classList.add('spot');}}
    if(S.tut===1){if(st.board.some(c=>c.it&&!c.lock&&key(c.it)==='i:fruit:2')){S.tut=2;}
      else{txt='Отлично! Теперь <b>перетащи вишню на другую вишню</b> — они соединятся в клубнику!';st.board.forEach((c,i)=>{if(c.it&&!c.lock&&key(c.it)==='i:fruit:1')cellEl(i)&&cellEl(i).classList.add('spot');});}}
    if(S.tut===2){txt='Бабушка Роза ждёт клубнику! Нажми зелёную кнопку <b>«Подать»</b>.';const b=document.querySelector('.o-serve');b&&b.classList.add('spot');}
    if(S.tut===3){txt='Ура! За заказы ты получаешь ⭐ опыт и 🪙 монеты. Новые уровни открывают рецепты, приборы и рестораны по всему миру!';btn='<br><button class="sb g" id="tutNext">Дальше</button>';}
    if(S.tut===4){txt='Монеты нужны для ремонта кафе — кнопка 🏠 внизу. Если доска заполнится — продавай лишнее или убирай в ❄️ холодильник. Удачи, шеф!';btn='<br><button class="sb g" id="tutNext">Начать!</button>';$('#homeBtn').classList.add('spot');}
  }
  if(!txt){el.style.display='none';return;}
  $('#tutTxt').innerHTML=txt+btn;el.style.display='flex';
  const mid=$('#mid');el.style.top=(mid.offsetTop+ (S.tut<=1&&!tutForced? mid.offsetHeight*0.02 : mid.offsetHeight*0.02))+'px';
  if(S.tut===2&&!tutForced)el.style.top=(mid.offsetTop+mid.offsetHeight*.25)+'px';
  const n=$('#tutNext');if(n)n.onclick=()=>{S.tut++;save();tutUpdate();snd('tick');};
  const o=$('#tutOk');if(o)o.onclick=()=>{tutForced=null;tutUpdate();snd('tick');};
}

/* ---------------- FX ---------------- */
function flyEmoji(e,from,to,dur=600){
  const el=document.createElement('span');el.className='fly emo';el.textContent=e;$('#fx').appendChild(el);
  const x0=from.left+from.width/2-20,y0=from.top+from.height/2-20,x1=to.left+to.width/2-20,y1=to.top+to.height/2-20;
  const a=el.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`},{transform:`translate(${(x0+x1)/2+30}px,${Math.min(y0,y1)-60}px) scale(1.2)`,offset:.45},{transform:`translate(${x1}px,${y1}px) scale(.5)`,opacity:.9}],{duration:dur,easing:'ease-in-out'});
  a.onfinish=()=>el.remove();return a;
}
function flyTo(e,from,sel){const t=$(sel);if(!t)return;for(let j=0;j<3;j++)setTimeout(()=>{const a=flyEmoji(e,from,rectOf(t),650);a.addEventListener('finish',()=>t.animate([{transform:'scale(1.15)'},{transform:'none'}],{duration:200}));},j*90);}
function floatTxt(t,r,col){const el=document.createElement('span');el.className='ftxt outl';el.textContent=t;if(col)el.style.color=col;$('#fx').appendChild(el);
  const x=r.left+r.width/2,y=r.top;el.style.left=x+'px';el.style.top=y+'px';
  el.animate([{transform:'translate(-50%,0) scale(.6)',opacity:0},{transform:'translate(-50%,-20px) scale(1.1)',opacity:1,offset:.25},{transform:'translate(-50%,-60px) scale(1)',opacity:0}],{duration:1100,easing:'ease-out'}).onfinish=()=>el.remove();}
function burst(r,n=10){const cx=r.left+r.width/2,cy=r.top+r.height/2;for(let j=0;j<n;j++){const p=document.createElement('span');p.className='part';p.textContent=pick(['✦','★','✧','•']);$('#fx').appendChild(p);
  const a=j/n*Math.PI*2+Math.random()*.4,d=30+Math.random()*30;p.animate([{transform:`translate(${cx}px,${cy}px) scale(.4)`,opacity:1},{transform:`translate(${cx+Math.cos(a)*d}px,${cy+Math.sin(a)*d}px) scale(1)`,opacity:0}],{duration:550+Math.random()*250,easing:'cubic-bezier(.2,.8,.4,1)'}).onfinish=()=>p.remove();}}
function confetti(){const W=innerWidth,H=innerHeight;for(let j=0;j<60;j++){const p=document.createElement('span');p.className='part';p.textContent=pick(['🎉','✨','⭐','🎊','💫']);p.classList.add('emo');p.style.fontSize=(14+rnd(14))+'px';$('#fx').appendChild(p);
  const x=Math.random()*W;p.animate([{transform:`translate(${x}px,-30px) rotate(0)`},{transform:`translate(${x+(Math.random()-.5)*160}px,${H+30}px) rotate(${rnd(720)}deg)`}],{duration:1600+Math.random()*1400,delay:Math.random()*400,easing:'cubic-bezier(.3,.1,.6,1)'}).onfinish=()=>p.remove();}}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1900);}

/* ---------------- HINT WIGGLE ---------------- */
let idleT=0;function idleReset(){idleT=now();}
setInterval(()=>{if(now()-idleT<7000||mOpen||$('#home').classList.contains('on'))return;idleT=now();
  const st=ST(),m={};for(let i=0;i<NCELL;i++){const c=st.board[i];if(!c.it||c.lock||c.it.b||c.it.k==='g'||c.it.k==='a')continue;const k=key(c.it);if(!canMerge(c.it,c.it))continue;(m[k]=m[k]||[]).push(i);}
  const ice=[];st.board.forEach((c,i)=>{if(c.lock==='ice'&&c.it)ice.push([key(c.it),i]);});
  let pair=null;for(const k in m)if(m[k].length>=2){pair=m[k].slice(0,2);break;}
  if(!pair)for(const [k,i] of ice)if(m[k]){pair=[m[k][0],i];break;}
  if(pair)pair.forEach(i=>{const e=cellEl(i);if(e){e.classList.remove('wig');void e.offsetWidth;e.classList.add('wig');setTimeout(()=>e.classList.remove('wig'),1300);}});
},1000);

/* ---------------- SOUND ---------------- */
let AC=null;function audioUnlock(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type='sine',v=.12,delay=0,f2){if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function snd(k){if(!S||!S.sound||!AC)return;try{
  if(k==='pop')tone(520,.12,'sine',.12,0,880);
  else if(k==='tick')tone(700,.05,'triangle',.06);
  else if(k==='merge'){tone(523,.1,'triangle',.11);tone(659,.1,'triangle',.11,.07);tone(988,.18,'triangle',.11,.14);}
  else if(k==='coin'){tone(1320,.08,'square',.05);tone(1760,.16,'square',.05,.07);}
  else if(k==='serve'){[523,659,784,1047].forEach((f,j)=>tone(f,.22,'triangle',.1,j*.07));}
  else if(k==='level'){[523,659,784,1047,1319].forEach((f,j)=>tone(f,.3,'triangle',.11,j*.09));}
  else if(k==='err')tone(200,.18,'sawtooth',.06,0,140);
  else if(k==='ding'){tone(1568,.3,'sine',.09);tone(2093,.4,'sine',.06,.08);}
}catch(e){}}

/* ---------------- LAYOUT ---------------- */
function layout(){
  const app=$('#app');const W=app.clientWidth,H=app.clientHeight;
  const top=$('#top').offsetHeight,bot=$('#bottom').offsetHeight;
  const availH=H-top-bot-30,availW=W-34;
  const cs=Math.floor(Math.min(availW/COLS-3,availH/ROWS-3,74));
  document.documentElement.style.setProperty('--cs',Math.max(34,cs)+'px');
}
addEventListener('resize',()=>{layout();tutUpdate();});

/* ---------------- WIRING ---------------- */
$('#fridgeBtn').addEventListener('click',()=>{audioUnlock();openFridge();});
$('#homeBtn').addEventListener('click',()=>{audioUnlock();snd('tick');openHome();});
$('#shopBtn').addEventListener('click',()=>{audioUnlock();snd('tick');openShop();});
$('#menuBtn').addEventListener('click',()=>{audioUnlock();snd('tick');openMenu();});
$('#enPill').addEventListener('click',()=>{audioUnlock();openEnergy();});
$('#gemPill').addEventListener('click',()=>{audioUnlock();openShop();});
$('#coinPill').addEventListener('click',()=>{audioUnlock();openHome();});
$('#lvlBtn').addEventListener('click',()=>{audioUnlock();const n=xpNeed(S.lvl);modal('Уровень '+S.lvl,`<div class="center"><p>Опыт: <b>${S.xp} / ${n}</b> ⭐</p><div class="bar" style="margin:10px 0"><i style="width:${S.xp/n*100}%"></i></div><p style="font-size:13px;color:#9a6a44">Выполняй заказы, чтобы получать опыт. Каждый уровень даёт 💎 и ⚡, а также открывает новые рецепты и рестораны. Максимум — ${MAX_LVL} уровень.</p></div>`);});
(function badge(){const pts=[];for(let j=0;j<16;j++){const a=j/16*Math.PI*2-Math.PI/2,r=j%2?20.5:23;pts.push((25+Math.cos(a)*r).toFixed(1)+','+(25+Math.sin(a)*r).toFixed(1));}$('#lvlPoly').setAttribute('points',pts.join(' '));
  const p2=pts.map(s=>{const [x,y]=s.split(',').map(Number);return (25+(x-25)*.78).toFixed(1)+','+(25+(y-25)*.78).toFixed(1);});$('#lvlPoly2').setAttribute('points',p2.join(' '));})();

/* ---------------- BOOT ---------------- */
function boot(){
  load();regen();
  // offline cooking completion handled in tick
  layout();
  if(!S.rests[RESTS[S.ri].id])S.rests[RESTS[S.ri].id]=makeRest(S.ri);
  processUnlocks(true);fillOrders(true);applyScene();ensureDaily();renderAll();tick();
  setInterval(tick,1000);
  const b=$('#boot');setTimeout(()=>{b.style.opacity=0;setTimeout(()=>b.remove(),400);},500);
  if(S.tut>=5||S.stats.served>0)checkLogin();else{S.login={d:today(),day:1};}
  save();
}
if(document.fonts&&document.fonts.ready){Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(boot);}else boot();
</script>
